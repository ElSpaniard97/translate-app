<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spanish → English</title>
  <meta name="theme-color" content="#1f6feb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Spanish → English</h1>
    <div class="controls">
      <select id="dialect" aria-label="Spanish dialect">
        <option value="es-US">Spanish (US)</option>
        <option value="es-MX">Spanish (Mexico)</option>
        <option value="es-ES">Spanish (Spain)</option>
      </select>
      <button id="toggle" class="primary">Start listening</button>
      <button id="clear">Clear</button>
    </div>
    <p id="status" role="status">Press “Start listening” and allow the microphone.</p>
  </header>

  <main>
    <ol id="lines"></ol>
    <p id="interim" aria-live="polite"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
